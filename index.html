/* APEXIA upgraded student hub */
.exam-picker-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:760px;margin:0 auto 18px}
.exam-picker-row select,.tool-form input,.tool-form select,.tool-form textarea{width:100%;padding:13px;border:1px solid #d8d1c2;border-radius:10px;background:#fff}
#examGrid{display:block;max-width:760px;margin:0 auto}
.exam-picker-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.exam-picker-card strong{display:block;font-size:1.08rem}
.exam-picker-card p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.hub-section{padding:46px 0;background:#f6f2e8}
.hub-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.hub-link{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:140px;transition:.15s}
.hub-link:hover{border-color:var(--gold);transform:translateY(-2px)}
.hub-link .hub-icon{font-size:1.65rem}
.hub-link h3{margin:6px 0;font-size:1rem}
.hub-link p{margin:0;color:var(--muted);font-size:.86rem}
.tool-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}
.tool-form{display:grid;gap:11px}
.tool-form textarea{min-height:95px}
.tool-item{padding:14px;border:1px solid var(--line);border-radius:11px;margin:10px 0;background:#fff}
.tool-item small{color:var(--muted)}
.tool-item button{margin:6px 5px 0 0}
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.notice-box{padding:13px 15px;border-radius:10px;background:#fff6d9;border:1px solid #ead69b;color:#5d4813}
.timer-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer-display{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:#8a6718}
@media(max-width:800px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-grid{grid-template-columns:1fr}}
@media(max-width:520px){.exam-picker-row{grid-template-columns:1fr}.exam-picker-card{align-items:flex-start;flex-direction:column}.hub-grid{grid-template-columns:1fr 1fr}.hub-link{padding:13px;min-height:130px}}

.toolbar,.actions,.tabs,.viewhead,.assessment-top{flex-wrap:wrap}

.apx-page-back{margin:0 0 14px}.apx-page-back button{min-width:132px}
